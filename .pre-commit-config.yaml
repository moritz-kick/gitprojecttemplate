exclude: "_version.py" # File for setuptools_scm

default_language_version: # Markdownlint may use old node version.
    node: latest

repos:

# ----------------------------------------------------------------------------

- repo: https://github.com/pre-commit/pre-commit-hooks
  # Pre-Commit Out-of-the-box hooks.
  rev: v5.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=3000"]
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: requirements-txt-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-xml
  - id: name-tests-test
    args: [--pytest-test-first]
  - id: check-illegal-windows-names # Use Python: pathlib
  - id: mixed-line-ending
#  - id: check-docstring-first

# ----------------------------------------------------------------------------

- repo: https://github.com/igorshubovych/markdownlint-cli
  # Lints the Markdown files in the project.
  # For Documentation and README.md
  rev: v0.45.0
  hooks:
  - id: markdownlint-fix
    args: ["--fix"]

# ----------------------------------------------------------------------------

- repo: https://github.com/srstevenson/nb-clean
  # Cleans metadata from notebooks.
  rev: 4.0.1
  hooks:
    - id: nb-clean
      exclude: "docs"
      args:
        - --remove-empty-cells
        - --preserve-cell-outputs
#        - --preserve-execution-counts # This should be added when using
                                       # enforce-notebook-run-order

# ----------------------------------------------------------------------------

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff: Formatter and Linter.
  rev: v0.11.10
  hooks:
    - id: ruff
      types_or: [python, pyi, jupyter]
      args: [--fix]
    - id: ruff-format
      types_or: [python, pyi, jupyter]

