[tox]
requires =
    tox>=4.4
env_list =
    py{39,310,311,312}-pytest

# ----------------------------------------------------------------------------

[testenv]
description = this env is used for global settings in the other env.

# ----------------------------------------------------------------------------

# Environment for building the project specific environment.
[testenv:py{39,310,311,312}{,-dev,-test,-docs,-all}]
description = Install the package editable with extra dependencies in .venv
commands =
    pip install .
    dev: pip install -e .["dev"]
    test: pip install -e .["test"]
    docs: pip install .["docs"]
    all: pip install -e .["dev,test,docs"]
env_dir = {posargs:.venv}

# ----------------------------------------------------------------------------

# Environment for creating a requirements.txt form
# the project.toml for the project.
[testenv:py{39,310,311,312}-requirements]
description = Creates and/or updates the requirements.txt for user and dev.
skip_install = true
deps =
    pip-tools
commands =
    pip-compile -q --resolver=backtracking  --strip-extras -o requirements-{base_python}.txt pyproject.toml
    pip-compile -q --resolver=backtracking  --extra dev --extra docs --extra test -o requirements-{base_python}-dev.txt pyproject.toml

# ----------------------------------------------------------------------------

# Environment for running pre-commit hooks.
# For an overview of hooks and settings see
# in .pre-commit-config.yaml.
[testenv:pre-commit{-run,-update,-clean,-all-files}]
description = runs pre-commit on all files.
skip_install = true
deps =
    pre-commit
commands =
    clean: pre-commit clean
    clean: pre-commit gc
    update: pre-commit autoupdate # Update pre-commit hooks.
    all-files: pre-commit run --all-files
    run: pre-commit run #--show-diff-on-failure

# ----------------------------------------------------------------------------

[testenv:mypy]
extras =
    dev
commands = mypy

# ----------------------------------------------------------------------------

# Environment for running pytest.
[testenv:py{39,310,311,312}-pytest]
extras =
    test
commands = pytest {posargs:-n auto}

# ----------------------------------------------------------------------------

# Environment for building documentation.
# All settings and extensions in /docs/conf.py.
[testenv:docs{,-uml,-clean}]
description = invoke sphinx-build to build HTML docs
allowlist_externals =
    rm
extras =
    docs
commands =
    clean: rm -rfv ./reports/tools/sphinx/docs/* ./docs/source/_autosummary/*
    uml: pyreverse --colorized -o dot -d docs/source/uml inverso
    sphinx-build --color -b html ./docs/source/ ./reports/tools/sphinx/docs/
    sphinx-build -M coverage ./docs/source/ ./reports/tools/sphinx/docs_coverage
