[tox]
# tox-uv: environments are created and installed with uv (much faster than
# virtualenv + pip). tox installs it automatically if it is missing.
requires =
    tox>=4.22
    tox-uv>=1.20
env_list =
    py3{11,12,13,14}
# Interpreters that are not installed are skipped instead of failing the run.
skip_missing_interpreters = true

# ----------------------------------------------------------------------------

# Default environment: runs the test suite, e.g. `tox -e py312`.
# All other environments inherit these settings.
[testenv]
description = run the tests with pytest on {base_python}
extras =
    test
commands =
    pytest {posargs:-n auto}

# ----------------------------------------------------------------------------

# Environment for development (editable install with all extras).
# Create it with:  tox devenv -e dev .venv
[testenv:dev]
description = development environment with the dev, test and docs extras
# tox-uv creates environments without pip; the development environment gets
# pip, so `pip install` and `%pip install` in notebooks work.
uv_seed = true
extras =
    dev
    test
    docs
commands =
    python -c "print('Create the development venv with: tox devenv -e dev .venv')"

# ----------------------------------------------------------------------------

# Environment for creating pinned requirements files from the pyproject.toml.
# --universal: one file for all supported Python versions and platforms
# (environment markers where they differ), no extra interpreters needed.
[testenv:requirements]
description = create/update requirements.txt and requirements-dev.txt (pinned versions)
skip_install = true
deps =
    uv>=0.5
commands =
    uv pip compile --quiet --universal pyproject.toml -o requirements.txt
    uv pip compile --quiet --universal --all-extras pyproject.toml -o requirements-dev.txt

# ----------------------------------------------------------------------------

# Environments for running pre-commit hooks.
# For an overview of hooks and settings see .pre-commit-config.yaml.
[testenv:pre-commit]
description = run all pre-commit hooks on all files
skip_install = true
deps =
    pre-commit>=4.0
commands =
    pre-commit run --all-files --show-diff-on-failure {posargs}

[testenv:pre-commit-update]
description = update the pre-commit hook revisions
skip_install = true
deps = {[testenv:pre-commit]deps}
commands =
    pre-commit autoupdate {posargs}

[testenv:pre-commit-clean]
description = remove the cached pre-commit hook environments
skip_install = true
deps = {[testenv:pre-commit]deps}
commands =
    pre-commit clean
    pre-commit gc

# ----------------------------------------------------------------------------

[testenv:mypy]
description = run the static type checker
extras =
    dev
commands =
    mypy {posargs}

# ----------------------------------------------------------------------------

# Environment for building documentation.
# All settings and extensions in docs/source/conf.py.
# Warnings are errors (-W), so broken links or references fail the build
# instead of piling up; --keep-going reports all of them at once.
[testenv:docs{,-uml,-clean}]
description = build the HTML docs with sphinx (-uml: regenerate UML, -clean: from scratch)
extras =
    docs
commands =
    clean: python -c "import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ('reports/tools/sphinx', 'docs/source/_autosummary')]"
    uml: pyreverse -o mmd -d docs/source/uml template
    sphinx-build --color -W --keep-going -b html docs/source reports/tools/sphinx/docs {posargs}
    sphinx-build --color -W --keep-going -b coverage docs/source reports/tools/sphinx/docs_coverage {posargs}

# Live preview: rebuilds the docs on every change and reloads the browser.
[testenv:docs-serve]
description = serve the docs with live reload on http://127.0.0.1:8000
extras =
    docs
commands =
    sphinx-autobuild --watch src docs/source reports/tools/sphinx/docs {posargs}
