[build-system]
requires = [
    "setuptools",
    "setuptools-scm>=8.0",
    "wheel",
]

build-backend = "setuptools.build_meta"

# ----------------------------------------------------------------------------

# Most of the settings here are general for all build systems, but here is a
# reference for setuptools.
# https://setuptools.pypa.io/en/latest/references/keywords.html

[project]
name = "inverso"
dynamic = ["version"]
authors = [
    {name="MAX MUSTERMANN", email="MAX@MUSTER.MANN"},
    ]
maintainers = [
    {name="MAX MUSTERMANN", email="MAX@MUSTER.MANN"},
    ]
description = "TEMPLATE DESCRIPTION"
readme = "README.md"
requires-python = ">=3.9"
license = {text=""}

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "pandas", "torch",
    "gymnasium", "stable_baselines3",
    "tqdm", "rich", "tensorboard", "numpy",
    "jinja2", "beautifulsoup4"
                ]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.5",
    "tox>=4.4",
    #"mypy>=1.10",
    #"pylint>=3.2",
    ]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-xdist>=3.6",
    "pytest-sugar",
    #"pytest-randomly", "pytest-order"
    "pytest-html",
    "pytest-datadir",

    # "pytest-reportlog" # Idea: AI- Support
]
docs = [
    "furo>2024.5",
    "myst-parser>3.0",
    "nbsphinx>=0.9",
    "pylint>=3.2",
    "sphinx>=7.3",
    "sphinx-copybutton>=0.5",
    "sphinx-gallery>=0.16",
    "sphinx-inline-tabs>=2023.4",
    "tomli>=2.0;python_version<'3.11'",
    "matplotlib",
    "ipykernel",
  ]


# [project.urls]
#Homepage = "https://example.com"
#Documentation = "https://readthedocs.org"
#Repository = "https://github.com/me/spam.git"
#Issues = "https://github.com/me/spam/issues"
#Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

# THE SETUPTOOLS FIND SHOULD WORK WITHOUT THIS.
# CONFIRM FROM OTHER PROJECT.
# [tool.setuptools.packages.find]
# All the following settings are optional:
# where = ["src"]  # ["."] by default
# include = ["mypackage*"]  # ["*"] by default
# exclude = ["mypackage.tests*"]  # empty by default
# namespaces = false  # true by default

# ----------------------------------------------------------------------------

[tool.setuptools_scm]
version_file = "src/inverso/_version.py"
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"

# ----------------------------------------------------------------------------

[tool.pytest.ini_options]
required_plugins = ["pytest-xdist", "pytest-mock", "pytest-cov", "pytest-sugar"]
addopts = "-ra --cov --cov-report=html --cov-context=test --html=reports/tools/pytest/test_report.html --self-contained-html" # ToBeDiscussed: -q --strict-markers
testpaths = [
  "tests/",
]

# There should be no tests for experimental functionality.
# When working functionality is created in a Notebook it should be refactored
# into the package.  Test should be written for the new functionality.

#norecursedirs = ["tests/_experimental",]

log_cli = true
log_cli_level = 'info'
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d_%H:%M:%S"


log_file_format = "%(asctime)s [%(levelname)s] %(message)s"
log_file_date_format = "%Y-%m-%d_%H:%M:%S"
log_file = "reports/tools/pytest/logs/pytest-logs.txt"

[tool.coverage.run]
source = ["inverso"]
branch = true
data_file = "reports/tools/coverage/tmp/.coverage"
relative_files = true
omit = ["tests/*"] # "*/_experimental/*"


[tool.coverage.html]
directory = "reports/tools/coverage/html"
show_contexts = true
skip_empty = true

# ----------------------------------------------------------------------------

[tool.mypy]
files = ["src/**/*.py"]
warn_unused_configs = true

disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
implicit_optional = true
warn_unused_ignores = true

# ----------------------------------------------------------------------------

[tool.ruff]
fix = true
force-exclude = true
indent-width = 4
line-length = 120
extend-include = ["*_tracked.ipynb"]

extend-exclude = [
    "tests",
    "docs",
    "__pycache__",
    "*.egg-info",
    "_version.py",
]

[tool.ruff.lint]
select = ["ALL"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

ignore = [
    # pydocstyle (E, W)

    "E111", # Rule enforced by formatter
    "E114", # Rule enforced by formatter
    "E117", # Rule enforced by formatter
    "W191", # Rule enforced by formatter

    # pydocstyle (D)

    # Missing docstring in magic method
    "D105",
    # Missing docstring in __init__
    "D107",
    "D206", # Rule enforced by formatter
    "D300", # Rule enforced by formatter

    # flake-badit (S)

    # blacklist: pseudo-random generators are not suitable for
    # security/cryptographic purposes, which is not the case in this project
    "S311",
    "S101",

    # flake-commas (COM)
    "COM812", # Rule enforced by formatter
    "COM819", # Rule enforced by formatter

    # flake-implicit-str-concat (ISC)
    "ISC001", # Rule enforced by formatter
    "ISC002", # Rule enforced by formatter

    # flake-unused-arguments (ARG)
    # Ignore argument checker that might conflict mypy's signature checking
    # Here all but one are ignored consider ignoring all rules (ARG)
    "ARG001",
    "ARG002",
    "ARG003",
    "ARG004",

    # Ignored whole error groups as not convenient for this project
    "C90",
    "PD901",
    #"N",
    "ANN",
    "ASYNC",
    "TRIO",
    "FBT",
    "CPY",
    "T10",
    "DJ",
    "EXE",
    "FA",
    # "ICN",
    "G",
    "PT",
    "Q",
    "RSE",
    "INT",
    "TD",
    "FIX",
    "ERA",
    "PL",
    "TRY",
    "AIR",
    "FURB",
]


[tool.ruff.format]

quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "google"
