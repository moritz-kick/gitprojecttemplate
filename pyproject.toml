[build-system]
# setuptools>=77 is needed for PEP 639 license expressions (`license = "MIT"`).
# `wheel` is no longer required: bdist_wheel ships with setuptools since v70.1.
requires = [
    "setuptools>=77",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

# ----------------------------------------------------------------------------

# Most of the settings here are general for all build systems, but here is a
# reference for setuptools.
# https://setuptools.pypa.io/en/latest/references/keywords.html
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
# Rename the package: change `name` here, rename `src/template/` and update
# the other places listed in the README ("Project Information").
name = "template"
dynamic = ["version"] # Set by setuptools-scm from the latest git tag.
authors = [
    {name = "MAX MUSTERMANN", email = "max@mustermann.example"},
]
maintainers = [
    {name = "MAX MUSTERMANN", email = "max@mustermann.example"},
]
description = "TEMPLATE DESCRIPTION"
readme = "README.md"
requires-python = ">=3.11"
# SPDX license expression (PEP 639), e.g. "MIT" or "Apache-2.0".
# Add a LICENSE file and uncomment `license-files` when choosing a license.
license = "LicenseRef-Proprietary"
# license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Runtime dependencies of the package (what a *user* of the package needs).
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.0",
    "ruff>=0.12",
    "tox>=4.22",
    #"pylint>=3.2",
]
test = [
    "pytest>=8.2",
    "pytest-cov>=6.0",
    "pytest-datadir>=1.5",
    "pytest-html>=4.1",
    "pytest-mock>=3.14",
    "pytest-sugar>=1.0",
    "pytest-xdist>=3.6",
    #"pytest-randomly", "pytest-order"
    # "pytest-reportlog" # Idea: AI- Support
]
docs = [
    "furo>=2024.5",
    "ipykernel>=6.0", # Executes notebooks without outputs (nbsphinx).
    "matplotlib>=3.8", # Used by the example notebook.
    "myst-parser>=3.0",
    "nbsphinx>=0.9",
    "pylint>=3.2", # Ships pyreverse, used for the UML diagrams.
    "sphinx>=7.3",
    "sphinx-copybutton>=0.5",
    "sphinx-inline-tabs>=2023.4",
]

# [project.urls]
#Homepage = "https://example.com"
#Documentation = "https://readthedocs.org"
#Repository = "https://github.com/me/spam.git"
#Issues = "https://github.com/me/spam/issues"
#Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

# Package discovery: setuptools finds the packages in `src/` automatically
# (src-layout), so no `[tool.setuptools.packages.find]` table is needed.

# ----------------------------------------------------------------------------

[tool.setuptools_scm]
# The version is read at runtime with `importlib.metadata` (see
# `src/template/__init__.py`), so no `version_file` needs to be generated.
# For smarter version schemes and other configuration options,
# check out https://github.com/pypa/setuptools_scm
version_scheme = "no-guess-dev"

# ----------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
required_plugins = ["pytest-cov", "pytest-html", "pytest-mock", "pytest-xdist"]
addopts = [
    "-ra",
    "--strict-markers", # Unknown markers are errors, not silent typos.
    "--strict-config", # Unknown config keys are errors.
    "--import-mode=importlib", # Recommended for new projects; no sys.path hacks.
    "--cov",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-context=test",
    "--html=reports/tools/pytest/test_report.html",
    "--self-contained-html",
]
testpaths = ["tests"]
xfail_strict = true

# There should be no tests for experimental functionality.
# When working functionality is created in a Notebook it should be refactored
# into the package.  Test should be written for the new functionality.

#norecursedirs = ["tests/_experimental",]

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s"
log_cli_date_format = "%Y-%m-%d_%H:%M:%S"

log_file = "reports/tools/pytest/logs/pytest-logs.txt"
log_file_format = "%(asctime)s [%(levelname)s] %(message)s"
log_file_date_format = "%Y-%m-%d_%H:%M:%S"

[tool.coverage.run]
source_pkgs = ["template"]
branch = true
data_file = "reports/tools/coverage/tmp/.coverage"
relative_files = true

[tool.coverage.paths]
# Tox installs the package (not editable), so map site-packages back to src/.
source = ["src/", "*/site-packages/"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "reports/tools/coverage/html"
show_contexts = true
skip_empty = true

# ----------------------------------------------------------------------------

[tool.mypy]
files = ["src"]
strict = true
warn_unreachable = true

# ----------------------------------------------------------------------------

[tool.codespell]
# Words that are spelled correctly but flagged by codespell.
ignore-words-list = "ser"
skip = "*.ipynb,*.dot"

# ----------------------------------------------------------------------------

[tool.ruff]
# Respect `exclude` even when files are passed explicitly (pre-commit does).
force-exclude = true
line-length = 120
# Notebooks (*.ipynb) are linted and formatted by default since ruff 0.6.

extend-exclude = [
    "docs",
]

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    # pycodestyle (E, W)

    "E111", # Rule enforced by formatter
    "E114", # Rule enforced by formatter
    "E117", # Rule enforced by formatter
    "W191", # Rule enforced by formatter

    # pydocstyle (D)

    # Missing docstring in magic method
    "D105",
    # Missing docstring in __init__
    "D107",
    "D206", # Rule enforced by formatter
    "D300", # Rule enforced by formatter

    # flake8-bandit (S)

    # blacklist: pseudo-random generators are not suitable for
    # security/cryptographic purposes, which is not the case in this project
    "S311",
    "S101",

    # flake8-commas (COM)
    "COM812", # Rule enforced by formatter
    "COM819", # Rule enforced by formatter

    # flake8-implicit-str-concat (ISC)
    "ISC001", # Rule enforced by formatter
    "ISC002", # Rule enforced by formatter

    # flake8-unused-arguments (ARG)
    # Ignore argument checker that might conflict mypy's signature checking
    # Here all but one are ignored consider ignoring all rules (ARG)
    "ARG001",
    "ARG002",
    "ARG003",
    "ARG004",

    # Ignored whole error groups as not convenient for this project
    "C90",
    #"N",
    "ANN",
    "ASYNC",
    "FBT",
    "CPY",
    "T10",
    "DJ",
    "EXE",
    "FA",
    # "ICN",
    "G",
    "PT",
    "Q",
    "RSE",
    "INT",
    "TD",
    "FIX",
    "ERA",
    "PL",
    "TRY",
    "AIR",
    "FURB",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D", # Test functions document themselves through their names.
    "INP001", # tests/ is not a package (pytest --import-mode=importlib).
]
"*.ipynb" = [
    "D", # Notebooks have no module/function docstrings.
    "INP001", # Notebooks are not part of a package.
    "T20", # print() is the normal way to show output.
    "B018", # A bare expression at the end of a cell displays it.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false
